name: Nightly

# Nightly build and validation.
#
# Builds the Linux (CUDA) and macOS (Metal) binaries, publishes them to the
# rolling `nightly` GitHub Release, then validates the Linux build by running
# the example suite on CUDA via Modal.
#
# Skipped if the latest commit is more than 24 hours old.

on:
  schedule:
    # 02:00 UTC = ~04:00 Paris. Lets the build finish before European
    # morning.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write   # publish-nightly creates/updates the `nightly` tag+release

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      nightly_version: ${{ steps.version.outputs.nightly_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Compute nightly version stamp
        id: version
        run: |
          BASE=$(grep '^version' sheaf/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          DATE=$(date -u +%Y%m%d)
          echo "nightly_version=${BASE}-nightly.${DATE}" >> "$GITHUB_OUTPUT"

      - name: Skip if last commit is older than 24h
        id: check
        run: |
          set -euo pipefail
          # ${{ github.event_name }} is 'schedule' for cron runs; manual
          # workflow_dispatch should always run.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "manual run: proceeding"
            exit 0
          fi
          # ISO-8601 UTC timestamps; compare epoch seconds.
          LAST=$(git log -1 --format=%cI)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EPOCH_LAST=$(date -u -d "$LAST" +%s)
          EPOCH_NOW=$(date -u -d "$NOW" +%s)
          AGE=$(( (EPOCH_NOW - EPOCH_LAST) / 86400 ))
          echo "last commit: $LAST  (age=${AGE}d)"
          if [[ "$AGE" -ge 1 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No commit in the last 24h: skipping nightly."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Recent commit: running nightly."
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    uses: ./.github/workflows/build.yml
    with:
      targets: '["linux-aarch64", "linux-x86_64", "macos-aarch64"]'
      build_version: ${{ needs.preflight.outputs.nightly_version }}

  publish-nightly:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Download all binary artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: sheaf-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la sheaf-*.tar.gz

      - name: Create / overwrite rolling `nightly` prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          body: |
            Nightly builds have not gone through release validation, and performance may differ from release builds.
            The Linux x86_64 build is covered by daily CUDA CI validation.

          prerelease: true
          files: sheaf-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cuda-test:
    needs: publish-nightly
    uses: ./.github/workflows/cuda-test.yml
    with:
      binary_url: "https://github.com/sheaf-lang/sheaf/releases/download/nightly/sheaf-linux-x86_64.tar.gz"
    secrets: inherit
