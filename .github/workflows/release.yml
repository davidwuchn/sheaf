name: Release
# Stable release pipeline.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # create the draft release

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      targets: '["linux-x86_64", "linux-aarch64", "macos-aarch64"]'
      # build_version left empty: use the Cargo package version (e.g. 2.2.0).

  release-draft:
    needs: cuda-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v5
        with:
          pattern: sheaf-*
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: sheaf-*.tar.gz
          body: |
            **DRAFT - CUDA validation passed.**

            This release was created automatically. Promote it manually after
            the remaining release checks are complete.

  cuda-test:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/cuda-test.yml
    with:
      # Test the exact tarball attached to the draft (draft URLs are not public).
      binary_artifact: "sheaf-linux-x86_64"
    secrets: inherit

  # NOTE: promotion to a public release is performed manually by a maintainer.
  # There is intentionally no automatic promote step here.
