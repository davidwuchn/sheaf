[package]
name = "sheaf-compiler"
version = "2.0.0"
edition = "2024"
authors = ["Damien Boureille"]
license = "MIT"
description = "A functional language for differentiable programming"

# Binary CLI
[[bin]]
name = "sheaf"
path = "src/bin/sheaf/main.rs"

# Library - sheaf-compiler.so
[lib]
name = "sheaf_compiler"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0"
ndarray = { version = "0.16", features = ["blas"] }
getrandom = "0.2"
rustyline = "14"
nvml-wrapper = "0.10"
libc = "0.2"
blas-src = { version = "0.10", features = ["accelerate"] }

[package.metadata]
iree-version = "3.10.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
